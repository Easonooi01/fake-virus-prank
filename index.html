<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>System Restart</title>
<style>
*{box-sizing:border-box}
html,body{
  margin:0;
  width:100%;
  height:100%;
  background:#000;
  color:#fff;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
body{
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
}
.screen{width:100%;padding:30px}
.logo{
  font-size:70px;
  margin-bottom:25px;
}
h1{
  font-size:28px;
  font-weight:500;
  margin:10px 0 35px;
}
.status{
  color:#aaa;
  font-size:18px;
  margin-bottom:20px;
}
.count{
  font-size:70px;
  font-weight:600;
  margin:20px;
}
.bar{
  width:85%;
  max-width:360px;
  height:8px;
  background:#222;
  border-radius:10px;
  margin:25px auto;
  overflow:hidden;
}
.progress{
  height:100%;
  width:0%;
  background:#fff;
  transition:width 1s linear;
}
.joke{
  display:none;
}
.joke h1{
  font-size:34px;
}
.joke p{
  color:#aaa;
  font-size:20px;
}
button{
  margin-top:20px;
  padding:12px 24px;
  border:1px solid #555;
  border-radius:10px;
  background:#222;
  color:#fff;
  font-size:17px;
}
</style>
</head>

<body>

<div class="screen" id="restart">
  <div class="logo">◉</div>
  <h1>正在重新启动</h1>
  <div class="status">System Restarting...</div>

  <div class="count" id="count">10</div>

  <div class="bar">
    <div class="progress" id="progress"></div>
  </div>

  <div class="status">请不要关闭此页面</div>
</div>

<div class="screen joke" id="joke">
  <div class="logo">😆</div>
  <h1>你中恶作剧了！</h1>
  <p>手机没有真的重启 😂</p>
  <button onclick="location.reload()">再来一次</button>
</div>

<script>
let n=10;
const count=document.getElementById("count");
const progress=document.getElementById("progress");

const timer=setInterval(()=>{
  n--;
  count.textContent=n;
  progress.style.width=((10-n)*10)+"%";

  if(n<=0){
    clearInterval(timer);
    document.getElementById("restart").style.display="none";
    document.getElementById("joke").style.display="block";
  }
},1000);
</script>

</body>
</html>
